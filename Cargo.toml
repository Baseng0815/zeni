[workspace]
members = [
    "finance",
    "inventory",
    "web",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Bastian Engel <bastian.engel00@gmail.com>"]
repository = "https://github.com/bastianengel/zeni"

[workspace.dependencies]
# Packages carry a `zeni-` prefix so they never shadow a registry crate of the
# same name (notably `inventory`, which dioxus pulls in transitively for server
# function registration). The dependency key is the unprefixed name, so callers
# still write `finance::…` / `inventory::…`.
finance = { package = "zeni-finance", path = "finance" }
# Default-off `extractors`, so a dependent that compiles to wasm gets only the
# domain types. Enable `inventory/extractors` on the native side that needs it.
inventory = { package = "zeni-inventory", path = "inventory", default-features = false }

derive_more = { version = "2", features = ["display", "from", "into"] }
dioxus = "0.7.9"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
ambiguous_negative_literals = "deny"
unit_bindings = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
# Money and quantity arithmetic is the core of this workspace; the cast lints
# are here to keep silent precision loss out of it.
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_precision_loss = "warn"
cast_sign_loss = "warn"
float_arithmetic = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
