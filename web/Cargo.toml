[package]
name = "zeni-web"
description = "zeni's web backend and frontend"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
dioxus = { workspace = true, features = ["fullstack", "router"] }
serde = { workspace = true }

# Both halves see the domain crates, so server functions can take and return
# domain types directly. The workspace entry leaves `inventory`'s `extractors`
# feature off — it pulls in an HTTP client and image decoding and cannot compile
# to wasm — and the `server` feature below turns it back on.
finance = { workspace = true }
inventory = { workspace = true }

[features]
default = ["web"]
# Client half: compiled for wasm32-unknown-unknown by `dx serve`.
web = ["dioxus/web"]
# Server half: compiled natively, and the only side that runs extraction.
server = ["dioxus/server", "inventory/extractors"]

[lints]
workspace = true
